<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Download your Telegram files securely with AV Botz."/>
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="{{ file_name }}" />
    <meta property="og:description" content="Secure file download powered by AV Botz" />
    <meta property="og:url" content="{{ file_url }}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/live.png"/>
    <meta name="theme-color" content="#06b6d4">

    <title>{{ file_name }} | AV Botz</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Premium Variables */
        :root {
            --bg-color: #09090b;
            --card-bg: rgba(24, 24, 27, 0.65);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-main: #06b6d4; /* Premium Cyan */
            --accent-glow: rgba(6, 182, 212, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            /* Cinematic Radial Gradient Background */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08), transparent 25%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Glassmorphism Card */
        .box {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
            text-align: center;
            width: 100%;
            max-width: 450px;
            position: relative;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }
        .box:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--accent-glow);
        }

        /* Icon Wrapper */
        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(6, 182, 212, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            color: var(--accent-main);
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-main);
            word-break: break-all;
            line-height: 1.4;
        }

        /* File Info Grid */
        .file-info {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .info-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 10px 15px;
            border-radius: 12px;
            flex: 1;
        }
        .info-badge span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .info-badge strong {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent-main);
        }

        /* Premium Download Button */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: #fff;
            text-decoration: none;
            padding: 16px 24px;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px var(--accent-glow);
            width: 100%;
        }
        .download-btn:hover {
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.5);
            transform: translateY(-2px);
        }
        .download-btn:active {
            transform: translateY(1px);
        }

        /* Footer styling */
        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            max-width: 500px;
        }
        .footer p {
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .footer a {
            color: var(--accent-main);
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 600;
        }
        .footer a:hover {
            color: #fff;
            text-decoration: underline;
        }
        .credit {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            border: 1px solid var(--border-glass);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="box">
        <!-- Floating File Icon -->
        <div class="icon-wrapper">
            <i data-lucide="file-down" style="width: 32px; height: 32px;"></i>
        </div>

        <h1 id="fileName">{{ file_name }}</h1>
        
        <!-- Premium Info Badges -->
        <div class="file-info">
            <div class="info-badge">
                <span>Size</span>
                <strong>{{ file_size }}</strong>
            </div>
            <div class="info-badge">
                <span>File ID</span>
                <strong>{{ file_unique_id }}</strong>
            </div>
        </div>

        <a class="download-btn" href="{{ file_url }}" download="{{ file_name }}">
            <i data-lucide="download-cloud"></i> Download File
        </a>
    </div>

    <div class="footer">
        <p><i data-lucide="shield-alert" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle; margin-right: 4px;"></i> {{ disclaimer }}</p>
        <p>
            <a href="{{ report_link }}"><i data-lucide="flag" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle; margin-right: 4px;"></i> Report File</a>
        </p>
        <div class="credit">
            Template by <a href="https://t.me/AV_BOTz_UPDATE" target="_blank">@AV_BOTz_UPDATE</a>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Optional: Clean up file name (removes underscores and dots for a cleaner look)
        const nameEl = document.getElementById('fileName');
        if(nameEl) {
            nameEl.innerText = nameEl.innerText.replace(/[\._]/g, ' ');
        }
    </script>

</body>
</html>
