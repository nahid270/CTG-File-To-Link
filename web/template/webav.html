    <style>
        :root {
            --bg-primary: #020617;
            --bg-secondary: #0f172a;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --glass: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            margin: 0; padding: 0; overflow-x: hidden;
        }

        .header {
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 1rem; position: sticky; top: 0; z-index: 1000;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

        /* প্নেয়ার কার্ড স্টাইল */
        .player-wrapper {
            background: #000; border-radius: 16px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .info-card {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 1.5rem; margin-top: 1.5rem;
        }

        .file-title { font-size: 1.3rem; font-weight: 700; word-break: break-all; margin-bottom: 1rem; }

        /* বাটন গ্রিড */
        .actions-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px; margin-top: 1.5rem;
        }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            background: #1e293b; color: #fff; text-decoration: none; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }

        .btn:hover { background: var(--accent-rose); transform: translateY(-2px); }
        .btn-main { background: var(--accent-rose); border: none; }

        /* আপনার সেই Universe কার্ড সেকশন */
        .cards-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem; margin-top: 3rem;
        }

        .card {
            background: var(--glass); padding: 1.5rem; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s;
        }

        .card:hover { border-color: var(--accent-rose); }
        .card-link {
            display: block; padding: 10px; background: rgba(0,0,0,0.3);
            margin-top: 8px; border-radius: 6px; color: #cbd5e1; text-decoration: none;
        }

        /* ফ্লোটিং বাটন (স্মার্ট প্রো লুক) */
        .fab {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--accent-rose); padding: 12px 20px;
            border-radius: 50px; font-weight: bold; color: #fff;
            text-decoration: none; box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
            display: none; z-index: 999;
        }
        @media (max-width: 768px) { .fab { display: flex; align-items: center; gap: 8px; } }
    </style>
</head>
<body>

<header class="header">
    <div style="max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between;">
        <a href="https://t.me/TGLinkBase" style="text-decoration:none; font-weight:800; color:#f43f5e; font-family:'JetBrains Mono';">TGLinkBase</a>
        <a href="https://t.me/TGLinkBase" style="color:#fff; text-decoration:none; font-size:0.9rem;">Join Group</a>

    </div>

    <div class="player-wrapper">
        <video id="player" playsinline controls data-poster="https://i.ibb.co/MxYbt8M1/x.jpg">
            <source src="{{file_url}}" type="video/mp4" />

    <div class="info-card">
        <h1 class="file-title" id="rawTitle">{{file_name}}</h1>
        
        <div class="actions-grid">
            <a href="{{file_url}}" class="btn btn-main" download>

            <button class="btn" onclick="openVLC()">

    <div style="margin-top: 4rem;">

        <div class="cards-grid">

                <h3>Our Channels</h3>
                <p>Exclusive content and real-time notifications.</p>
                <a href="https://t.me/TGLinkBase" class="card-link">TGLinkBase Main</a>
                <a href="https://t.me/+GL_XAS4MsJg4ODM1" class="card-link">Private Channel</a>

<a href="#" onclick="openMX()" class="fab">

</a>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
    lucide.createIcons();
    const player = new Plyr('#player');

    function openVLC() {
        window.location.href = `intent:{{file_url}}#Intent;package=org.videolan.vlc;S.title={{file_name}};end`;
    }

    function openMX() {
        window.location.href = `intent:{{file_url}}#Intent;package=com.mxtech.videoplayer.ad;S.title={{file_name}};end`;
    }

    function copyLink() {
        navigator.clipboard.writeText("{{file_url}}");
        alert("Link Copied to Clipboard!");
    }

    // ফাইল নেম ক্লিন করার লজিক
    const titleEl = document.getElementById('rawTitle');
    titleEl.innerText = titleEl.innerText.replace(/[\._]/g, ' ');
</script>
